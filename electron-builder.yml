appId: com.github.waikyaw9999.mydbtool
productName: mydbtool
copyright: Copyright © mydbtool contributors
asar: true
npmRebuild: false
nodeGypRebuild: false
directories:
  output: release
files:
  - electron/dist/**/*
  - package.json
  - "!**/node_modules/**"
  - "!.next/**"
  - "!src/**"
  - "!release/**"
extraResources:
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
      - "!.env"
      - "!.env.*"
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - zip
linux:
  category: Development
  target:
    - AppImage
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
